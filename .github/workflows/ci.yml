name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · migrate · seed · test)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image so migrations that CREATE EXTENSION vector succeed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gamescope
          POSTGRES_PASSWORD: gamescope
          POSTGRES_DB: gamescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamescope -d gamescope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: gamescope
      POSTGRES_PASSWORD: gamescope
      POSTGRES_DB: gamescope
      LLM_PROVIDER: local
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIM: "1536"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check app alembic
          ruff format --check app

      - name: Apply migrations (validates pgvector + FTS schema on real Postgres)
        run: alembic upgrade head

      - name: Seed reference + sample data
        run: python -m app.seed

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
