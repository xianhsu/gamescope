# GameScope local stack: Postgres (with pgvector) + FastAPI backend + Next.js frontend.
# Bring it up with:  docker compose up --build
# The backend runs migrations (and seeds sample data) automatically on start.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamescope}
      POSTGRES_DB: ${POSTGRES_DB:-gamescope}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamescope} -d ${POSTGRES_DB:-gamescope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-gamescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamescope}
      POSTGRES_DB: ${POSTGRES_DB:-gamescope}
      CORS_ORIGINS: http://localhost:3000
      # Providers default to local (no API key). Override to use OpenAI-compatible endpoints.
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # Seed sample + reference data on first start so the UI is never empty.
      SEED_ON_START: "true"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — the browser uses the host-mapped port.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    environment:
      # Browser (client components) talks to the API on the host-mapped port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      # Server-side rendering inside the container reaches the backend over the compose network.
      API_INTERNAL_BASE_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
